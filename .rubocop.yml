plugins:
  - rubocop-rails
  - rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/cache_schema.rb"
    - "db/queue_schema.rb"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/ClassAndModuleChildren:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "config/**/*"
    - "test/**/*"
    - "db/migrate/**/*"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/**/*"

Metrics/AbcSize:
  Exclude:
    - "db/migrate/**/*"

Rails/Output:
  Exclude:
    - "db/seeds.rb"
    - "db/seeds/**/*"

Layout/LineLength:
  Max: 120
  Exclude:
    - "config/initializers/devise.rb"
    # Annotate-generated schema comment for a partial unique index (name + composite columns + WHERE
    # clause) is longer than 120 chars and can't be shortened without diverging from what `annotaterb`
    # regenerates on every run.
    - "app/models/companies_document.rb"
    - "test/factories/companies_documents.rb"
    - "test/models/companies_document_test.rb"

# Integration tests assert against a sequential, dependent multi-step HTTP flow (e.g. register ->
# approve -> login -> create vessel -> ... -> complete) where each step's assertions depend on the
# side effects of every prior step in the same test — splitting them into one-assertion-per-test
# would require re-running the whole prefix per assertion, not make the suite more focused. The
# same reasoning extends to Metrics/ClassLength: a handful of these sequential tests in one file
# naturally runs long, the same way Metrics/BlockLength is already excluded for all of test/**/*.
Minitest/MultipleAssertions:
  Exclude:
    - "test/integration/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/integration/**/*"
    # One controller, many independent actions (index/show/create/destroy/5 lifecycle transitions/
    # tab_counts/offline_bundle) — naturally many small, focused test blocks in one file.
    - "test/controllers/api/v1/fisherman/manifests_controller_test.rb"
    # Same reasoning: index/show/ransack-filter/create/update/destroy plus owner+admin contact
    # variants, each its own focused test block.
    - "test/controllers/api/v1/company_profiles_controller_test.rb"
