default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "dofi_backend_development") %>
  logs:
    <<: *default
    database: <%= ENV.fetch("LOG_DATABASE_NAME", "#{ENV.fetch("DATABASE_NAME", "dofi_backend_development")}_logs") %>
    migrations_paths: db/log_migrate
    schema_dump: log_schema.rb
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "dofi_backend_development") %>_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: dofi_backend_test
  logs:
    <<: *default
    database: dofi_backend_test_logs
    migrations_paths: db/log_migrate
    schema_dump: log_schema.rb

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "dofi_backend_production") %>
  logs:
    <<: *primary_production
    database: <%= ENV.fetch("LOG_DATABASE_NAME", "#{ENV.fetch("DATABASE_NAME", "dofi_backend_production")}_logs") %>
    migrations_paths: db/log_migrate
    schema_dump: log_schema.rb
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME", "dofi_backend_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME", "dofi_backend_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("CABLE_DATABASE_NAME", "#{ENV.fetch("DATABASE_NAME", "dofi_backend_production")}_cable") %>
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
