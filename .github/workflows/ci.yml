name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The ROCBN company registry is a second, MySQL database: the lookup's tests run on a real MySQL.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tdd_db_test
          MYSQL_USER: rocbn_test
          MYSQL_PASSWORD: rocbn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: dofi_backend_development
      DEVISE_JWT_SECRET_KEY: ci-test-secret-key-base-not-for-production
      ROCBN_TEST_DB_HOST: 127.0.0.1
      ROCBN_TEST_DB_PORT: 3306
      ROCBN_TEST_DB_NAME: tdd_db_test
      ROCBN_TEST_DB_USERNAME: rocbn_test
      ROCBN_TEST_DB_PASSWORD: rocbn_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpq-dev libvips-dev

      - name: Update bundler-audit advisory database
        run: bundle exec bundler-audit update

      - name: Run full CI suite (setup, rubocop, brakeman, bundler-audit, tests, seeds)
        run: bin/ci

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
