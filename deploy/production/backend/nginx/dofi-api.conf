# BACKEND SERVER. Install as /etc/nginx/sites-available/dofi-api (steps: ../README.md, section 5).
# nginx is the only public entry; Rails listens on 127.0.0.1:3000 (docker-compose.yml) and is not reachable from outside.
# No TLS yet (no domain). When there is one, see ../README.md, section 10.
server {
    # One port only: 3000, the Web-to-App rule the client's firewall already has. Bound to the server's own address (not
    # 0.0.0.0) because Docker already publishes Rails on 127.0.0.1:3000; the two do not clash. If this server's IP
    # changes, change it here too (nginx -t fails otherwise). No port 80: the host firewall and the client do not open it.
    listen 10.252.8.12:3000;
    server_name _;

    server_tokens off;
    # The app rejects files over 10 MB (CompaniesDocument::MAX_FILE_SIZE); nginx's own default (1 MB) would hit first.
    client_max_body_size 12m;

    # WebSocket (notifications). Action Cable pings every few seconds, but keep idle connections open longer than 60 s.
    location /cable {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port the client used; $host drops it (see docs/minio/MINIO-PUBLIC-PROXY-SETUP.md).
        proxy_set_header Host $http_host;
        # Overwrite, never append: nginx is the only proxy, and a client-sent X-Forwarded-For must not reach
        # Rack::Attack (it trusts private ranges, so a spoofed value could dodge the per-IP throttles).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
