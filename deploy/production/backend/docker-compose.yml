name: dofi-backend-production

# ============================================================
# FINS / DoFI — Production Backend
# Server: OGCMET001API001 (10.252.8.12)
#
# Architecture:
# - Nginx: Native on host, listens on 10.252.8.12:3000 (see nginx/dofi-api.conf)
# - Rails API: Docker, port 3000 (localhost only)
# - Solid Queue: Docker background worker
# - PostgreSQL: External server (10.252.8.23)
# - ROCBN company registry: read-only MySQL on that same host (10.252.8.23:9139), reached through ROCBN_DB_* in .env
# - MinIO: External server (10.252.8.13)
#
# Deployment:
#   docker compose pull
#   docker compose run --rm api bin/rails db:prepare
#   docker compose up -d
#
# ============================================================

# Shared Rails configuration
x-rails: &rails
  image: ghcr.io/arya020595/st_dofi_backend:${IMAGE_TAG:-production}

  restart: unless-stopped

  init: true

  # Set here, not in .env, so a server .env cannot change it. The app refuses to boot with AD_MODE=mock when this
  # is production.
  environment:
    DEPLOY_ENV: production

  env_file:
    - .env

  stop_grace_period: 60s

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ==========================================================
  # Rails API
  # ==========================================================
  api:
    <<: *rails

    ports:
      - "127.0.0.1:3000:3000"

    # Optional, only if the AD certificate is not trusted by the image's system CA store: put the CA PEM on this host,
    # uncomment, and point AD_CA_FILE at the container path. Create the file first, or Docker creates a directory.
    # volumes:
    #   - ./certs/ad-ca.pem:/etc/dofi/ad-ca.pem:ro

    # Rails health endpoint
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -o /dev/null http://127.0.0.1:3000/up || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================
  # Solid Queue Background Worker
  # ==========================================================
  jobs:
    <<: *rails

    # Bypass Rails web entrypoint
    entrypoint: []

    # Start Solid Queue worker
    command:
      - "./bin/rails"
      - "solid_queue:start"

    # Allow time for jobs to finish during shutdown
    stop_grace_period: 120s
