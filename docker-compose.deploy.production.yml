# Deployment compose file for the government-provided production backend server.
# Copied by .github/workflows/cd-production.yml to the backend server on every push to main.
# Pulls the prebuilt image from GHCR instead of building on the server.
#
# This server runs ONLY the backend + MinIO — the database lives on a separate,
# independently-managed dedicated server (see docs/CI-CD-SETUP.md), reached via DATABASE_HOST in
# this server's own .env (not committed). There is no `db:` service here.
#
# Requires a .env file (not committed) alongside this file on the server — see .env.example for
# the full list of required keys, including DATABASE_HOST/PORT pointing at the DB server and the
# MINIO_* keys for the object storage container below.
#
# That .env's CORS_ORIGINS must list the frontend server's real origin — a missing entry shows up
# as a browser CORS error, not a 4xx/5xx. Edit .env on the server and restart the api container
# (rack-cors reads it once at boot).
name: dofi-backend-production

services:
  # S3-compatible object storage (replaces Cloudinary). Not published to the host — only
  # reachable from the api/jobs containers over the internal network. If the frontend needs to
  # reach image URLs directly, front this with the same reverse proxy that terminates TLS for
  # the api container, rather than publishing MinIO's port directly.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: dofi-backend-production-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dofi_production_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dofi-backend-production-net

  api:
    image: ghcr.io/arya020595/st_dofi_backend:production
    container_name: dofi-backend-production-api
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RAILS_ENV: production
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - dofi-backend-production-net

  jobs:
    image: ghcr.io/arya020595/st_dofi_backend:production
    container_name: dofi-backend-production-jobs
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RAILS_ENV: production
    env_file:
      - .env
    entrypoint: []
    command: ["./bin/rails", "solid_queue:start"]
    networks:
      - dofi-backend-production-net

volumes:
  dofi_production_minio_data:

networks:
  dofi-backend-production-net:
    driver: bridge
